<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>🌈 Temperature Converter</h1>
    <p class="tagline">Convert between Celsius, Fahrenheit, and Kelvin instantly</p>
    
    <div class="converter-box">
      <div class="input-group">
        <label for="temperature">Enter Temperature</label>
        <input type="number" id="temperature" placeholder="Enter value..." />
      </div>

      <div class="input-group">
        <label for="from">From</label>
        <select id="from">
          <option value="Celsius">Celsius (°C)</option>
          <option value="Fahrenheit">Fahrenheit (°F)</option>
          <option value="Kelvin">Kelvin (K)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="to">To</label>
        <select id="to">
          <option value="Celsius">Celsius (°C)</option>
          <option value="Fahrenheit">Fahrenheit (°F)</option>
          <option value="Kelvin">Kelvin (K)</option>
        </select>
      </div>

      <button id="convertBtn">Convert 🌡️</button>

      <div class="result-box" id="result">Result will appear here</div>
    </div>
  </div>

  <footer>
    <p>💻 Designed by <b>Divya Prabha</b> | OIBSIP Internship</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
